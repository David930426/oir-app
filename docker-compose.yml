services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_oirapp
    ports:
      - "27019:27017"
    environment:
      # Docker pulls these values directly from your .env file
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: ${DB_NAME:-oir_db}
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
      - mongo-data:/data/db

volumes:
  mongo-data: